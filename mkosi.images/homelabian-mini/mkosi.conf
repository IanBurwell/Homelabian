# Minimal homelabian image, with less installed out of the box
# See also: mkosi.conf.d/ for additional configuration snippets

[Config]
Dependencies=homelabian-base

[Output]
Format=disk
OutputExtension=img
ImageId=homelabian-mini

[Content]
Bootable=yes  # Ensures the image is bootable
Bootloader=uki  # Uses the Unified Kernel Image
BaseTrees=%O/homelabian-base  # Start from the homelabian-base tree rather than base debian
CleanPackageMetadata=no  # Needed to prevent removing dpkg/apt from the base image

# Remove docs, caches, and archives
RemoveFiles=/usr/share/doc/*,/usr/share/man/*,/usr/share/locale/*,/var/log/*,/var/cache/apt/archives/*,/var/cache/ldconfig/*

Packages=
    vim-tiny  # Tiny vim with fewer features (aka vi)
    linux-image-amd64       # Kernel image for x86-64 architecture and remove the below modules

KernelModules=*,-/sound/,-/drivers/media/,-/drivers/bluetooth/,-/drivers/net/wireless/,-/net/wireless/,-/net/bluetooth/,-/net/mac80211/