# Main configuration file for mkosi, orchestrating the image build

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64 

[Output]
Format=disk
OutputDirectory=build/

[Build]
Incremental=yes  # Saves time by reusing previous build artifacts
CacheDirectory=/var/tmp/mkosi-cache  # Required for incremental builds
ToolsTree=yes  # Uses a known set of tools to build rather than the host's
EnvironmentFiles=.env

[Content]
Bootable=yes  # Ensures the image is bootable
Bootloader=uki  # Uses the Unified Kernel Image (UKI) bootloader for modern systems
Locale=en_US.UTF-8
Timezone=America/New_York

Packages=
    systemd
    udev
    passwd                  # User management
    sudo                    # Granting admin privileges
    debian-archive-keyring  # Verifying apt package signatures
    login                   # Allow user login
    procps                  # Process status utilities like `free` and `ps`
    systemd-boot-efi
    systemd-ukify
    linux-image-amd64

BuildPackages=
    build-essential,
    curl
