# Base configuration file for mkosi, suppporting a minimal build
# See also: mkosi.conf.d/ for additional configuration snippets

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64 
Repositories=main,contrib,non-free,non-free-firmware

[Output]
Format=disk
OutputDirectory=build/

[Build]
Incremental=yes  # Saves time by reusing previous build artifacts
CacheDirectory=/var/tmp/mkosi-cache  # Required for incremental builds
ToolsTree=yes  # Uses a known set of tools to build rather than the host's
EnvironmentFiles=.env
WithNetwork=yes  # Allows network access during the build process

[Content]
Bootable=yes  # Ensures the image is bootable
Bootloader=uki  # Uses the Unified Kernel Image
Locale=en_US.UTF-8
Timezone=America/New_York

Packages=
    systemd
    udev
    passwd                  # User management
    debian-archive-keyring  # Verifying apt package signatures
    login                   # Allow user login
    systemd-boot-efi        # Required for UKI builds
    systemd-ukify           # Required for UKI builds
    linux-image-amd64       # Kernel image for x86-64 architecture
    apt
